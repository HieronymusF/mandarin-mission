name: mandarin_mission
description: "Mandarin Mission mobile learning app."
publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.1.3
  drift: 2.34.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.2.0
  flutter_riverpod: ^3.3.2
  flutter_timezone: 5.1.0
  go_router: ^17.3.0
  learning_core:
    path: ../../packages/learning_core
  mandarin_mission_content:
    path: ../../content
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  record: 7.1.1
  shadcn_ui: 0.55.0
  shared_preferences: ^2.5.5
  timezone: 0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: 2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/cosyvoice/
    - assets/images/
