name: mandarin_mission
description: "Mandarin Mission mobile learning app."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.1.3
  drift: 2.34.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  learning_core:
    path: ../../packages/learning_core
  mandarin_mission_content:
    path: ../../content
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  record: 7.1.1
  shadcn_ui: 0.55.0
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/cosyvoice/
    - assets/images/
